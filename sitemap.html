<style>
  :root{
    --bg:#E8E0D0;
    --surface:#F5F1E7;
    --surface-2:#EFE9DB;
    --ink:#332A20;
    --ink-soft:#6B5D4B;
    --ink-faint:#9A8B75;
    --accent:#8B5A2B;
    --accent-deep:#6E4520;
    --line:#D6CBB4;
    --line-strong:#C0B296;
    --radius:6px;
    --font:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1C1811; --surface:#262117; --surface-2:#2E281C; --ink:#F0E9DA;
      --ink-soft:#B8AB94; --ink-faint:#7E7159; --accent:#D79B5E; --accent-deep:#EBB77F;
      --line:#3B3324; --line-strong:#4C4230;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C1811; --surface:#262117; --surface-2:#2E281C; --ink:#F0E9DA;
    --ink-soft:#B8AB94; --ink-faint:#7E7159; --accent:#D79B5E; --accent-deep:#EBB77F;
    --line:#3B3324; --line-strong:#4C4230;
  }
  :root[data-theme="light"]{
    --bg:#E8E0D0; --surface:#F5F1E7; --surface-2:#EFE9DB; --ink:#332A20;
    --ink-soft:#6B5D4B; --ink-faint:#9A8B75; --accent:#8B5A2B; --accent-deep:#6E4520;
    --line:#D6CBB4; --line-strong:#C0B296;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }

  .app{display:flex; flex-direction:column; height:100vh;}

  /* ---------- 상단 바 ---------- */
  .topbar{
    display:flex; align-items:center; gap:10px;
    padding:12px 16px; background:var(--surface);
    border-bottom:1px solid var(--line-strong);
    flex-wrap:wrap;
  }
  .topbar h1{font-size:16px; font-weight:800; margin:0 22px 0 0; white-space:nowrap;}
  .topbar .spacer{flex:1;}
  .btn{
    display:flex; align-items:center; gap:6px;
    font-family:var(--font); font-size:13px; font-weight:700;
    color:var(--ink-soft); background:var(--surface-2);
    border:1px solid var(--line-strong); border-radius:var(--radius);
    padding:7px 12px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{color:var(--ink); background:var(--bg);}
  .btn.primary{background:var(--accent); color:var(--surface); border-color:var(--accent);}
  .btn.primary:hover{background:var(--accent-deep);}
  .btn svg{width:14px; height:14px; flex:none;}
  .save-state{font-size:12px; color:var(--ink-faint); white-space:nowrap;}

  /* ---------- 캔버스 ---------- */
  .canvas-wrap{
    position:relative; flex:1; overflow:hidden;
    background:
      radial-gradient(var(--line) 1px, transparent 1px);
    background-size:22px 22px;
    cursor:grab;
  }
  .canvas-wrap.panning{cursor:grabbing;}
  .canvas{
    position:absolute; top:0; left:0;
    transform-origin:0 0;
  }
  svg.links{position:absolute; top:0; left:0; overflow:visible; pointer-events:none;}
  .links path{fill:none; stroke:var(--line-strong); stroke-width:2;}

  .node{
    position:absolute;
    display:flex; align-items:center; gap:6px;
    background:var(--surface);
    border:1.5px solid var(--line-strong);
    border-radius:var(--radius);
    padding:8px 14px;
    font-size:14px; font-weight:700; color:var(--ink);
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
    box-shadow:0 1px 3px rgba(60,40,20,.08);
    max-width:230px;
  }
  .node .label{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    min-width:0;
  }
  .node.root{
    background:var(--accent); color:var(--surface); border-color:var(--accent);
    font-size:16px; padding:12px 20px;
  }
  .node.trainee{
    background:var(--surface-2); font-weight:800;
    border-color: var(--branch-color, var(--line-strong));
    color: var(--branch-color, var(--ink));
  }
  .node.leaf{ border-left: 3px solid var(--branch-color, var(--line-strong)); }
  .node.selected{outline:2.5px solid var(--accent); outline-offset:2px;}
  .node input{
    font:inherit; color:inherit; background:transparent; border:none; outline:none;
    width:auto; min-width:20px;
  }
  .collapse-dot{
    width:16px; height:16px; border-radius:50%;
    background:var(--accent); color:var(--surface);
    font-size:10px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    flex:none; cursor:pointer;
  }
  .node.root .collapse-dot, .node.trainee .collapse-dot{background:var(--surface); color:var(--accent);}

  /* ---------- 플로팅 툴바 ---------- */
  .ntoolbar{
    position:absolute; display:none; gap:4px;
    background:var(--ink); border-radius:var(--radius);
    padding:5px; box-shadow:0 6px 18px rgba(0,0,0,.25);
    z-index:20;
  }
  .ntoolbar.show{display:flex;}
  .ntoolbar button{
    width:28px; height:28px; border:none; border-radius:4px;
    background:transparent; color:var(--bg); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .ntoolbar button:hover{background:rgba(255,255,255,.15);}
  .ntoolbar button svg{width:15px; height:15px;}
  .ntoolbar .sep{width:1px; background:rgba(255,255,255,.2); margin:3px 2px;}

  /* ---------- 줌 컨트롤 ---------- */
  .zoomctl{
    position:absolute; right:16px; bottom:16px;
    display:flex; flex-direction:column; gap:6px;
    background:var(--surface); border:1px solid var(--line-strong);
    border-radius:var(--radius); padding:6px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
  }
  .zoomctl button{
    width:30px; height:30px; border:none; background:transparent;
    color:var(--ink-soft); font-size:16px; font-weight:800; cursor:pointer; border-radius:4px;
  }
  .zoomctl button:hover{background:var(--surface-2); color:var(--ink);}

  .hint{
    position:absolute; left:16px; bottom:16px;
    font-size:12px; color:var(--ink-faint);
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:8px 12px; line-height:1.7;
  }

  input[type=file]{display:none;}
</style>

<div class="app">
  <div class="topbar">
    <h1>🌳 젠트리 사이트맵</h1>
    <a class="btn" href="index.html">← 홈페이지로</a>
    <button class="btn" id="btnExpandAll">전체 펼치기</button>
    <button class="btn" id="btnCollapseAll">전체 접기</button>
    <div class="spacer"></div>
    <span class="save-state" id="saveState">저장됨</span>
    <button class="btn" id="btnImport">불러오기</button>
    <button class="btn" id="btnExport">내보내기 (JSON)</button>
    <button class="btn primary" id="btnReset">초기 구조로 리셋</button>
    <input type="file" id="fileInput" accept="application/json">
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas" id="canvas">
      <svg class="links" id="links"></svg>
    </div>
    <div class="ntoolbar" id="ntoolbar">
      <button data-act="child" title="하위 항목 추가 (Tab)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button data-act="sibling" title="같은 단계 항목 추가 (Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16M4 6h10M4 18h10"/></svg>
      </button>
      <button data-act="rename" title="이름 바꾸기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <div class="sep"></div>
      <button data-act="moveup" title="위로 이동">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
      <button data-act="movedown" title="아래로 이동">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </button>
      <div class="sep"></div>
      <button data-act="delete" title="삭제 (Delete)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
      </button>
    </div>

    <div class="zoomctl">
      <button id="zoomIn">+</button>
      <button id="zoomReset" style="font-size:11px;">100%</button>
      <button id="zoomOut">−</button>
    </div>

    <div class="hint">
      노드 클릭 → 도구 표시 · 더블클릭 → 이름 수정 · Tab 하위추가 · Enter 형제추가 · Delete 삭제 · Ctrl+↑↓ 순서 이동<br>
      빈 곳 드래그 → 화면 이동 · 마우스 휠 → 확대/축소
    </div>
  </div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'baobab-sitemap-v1';

  var SEED = {
    id:'root', text:'젠트리 GENTREE · 김남수 홈페이지', type:'root', collapsed:false,
    children:[
      section('01 나의 소개', [
        leaf('경력 · 특허 2건 이야기'),
        leaf('앞으로 배울 것 (가벽·중문·우물천장)')
      ]),
      section('02 훈련기록', [
        leaf('인스타그램 연결'),
        leaf('훈련장 사진')
      ]),
      section('03 나의 비전', []),
      section('04 내가 만든 작품', [
        leaf('육각기둥'),
        leaf('원목 벤치'),
        leaf('경첩 상자')
      ]),
      section('05 디지털 도구', [
        leaf('공구함 설계 (스케치업 + 실제 완성)'),
        leaf('이 홈페이지'),
        leaf('사이트맵 (이 마인드맵)')
      ]),
      section('연락 · 하단 고정 버튼', [
        leaf('전화하기'),
        leaf('인스타그램')
      ])
    ]
  };

  function section(name, children){
    return { id: uid(), text:name, type:'trainee', collapsed:false, children:children };
  }
  function leaf(text){ return { id: uid(), text:text, type:'leaf', collapsed:false, children:[] }; }
  function uid(){ return 'n' + Math.random().toString(36).slice(2,10); }

  var tree = loadTree();
  var selectedId = null;
  var editingId = null;

  var LEVEL_GAP = 270;
  var NODE_GAP = 54;

  var canvas = document.getElementById('canvas');
  var canvasWrap = document.getElementById('canvasWrap');
  var linksSvg = document.getElementById('links');
  var ntoolbar = document.getElementById('ntoolbar');
  var saveState = document.getElementById('saveState');

  var pan = { x: 80, y: 60 };
  var zoom = 1;

  function loadTree(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    }catch(e){}
    return JSON.parse(JSON.stringify(SEED));
  }

  var saveTimer = null;
  function scheduleSave(){
    saveState.textContent = '저장 중…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tree));
        saveState.textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      }catch(e){
        saveState.textContent = '저장 실패 (브라우저 저장공간 부족)';
      }
    }, 300);
  }

  function findNode(node, id){
    if (node.id === id) return node;
    for (var i=0;i<node.children.length;i++){
      var r = findNode(node.children[i], id);
      if (r) return r;
    }
    return null;
  }
  function findParent(node, id, parent){
    if (node.id === id) return parent;
    for (var i=0;i<node.children.length;i++){
      var r = findParent(node.children[i], id, node);
      if (r !== undefined && r !== null) return r;
    }
    return null;
  }

  /* ---------- 레이아웃 ---------- */
  function layout(){
    var yCursor = { v: 0 };
    positionNode(tree, 0, yCursor);
  }
  function positionNode(node, depth, yCursor){
    node._x = depth * LEVEL_GAP;
    var visibleChildren = node.collapsed ? [] : node.children;
    if (!visibleChildren.length){
      node._y = yCursor.v;
      yCursor.v += NODE_GAP;
      return node._y;
    }
    var ys = visibleChildren.map(function(c){ return positionNode(c, depth+1, yCursor); });
    node._y = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
    return node._y;
  }

  /* ---------- 렌더링 ---------- */
  var BRANCH_PALETTE = ['#8B5A2B','#3F6B5E','#7A5A8C','#A34B3F','#4A6B8A','#8A8B3F','#B5773F'];

  function render(){
    layout();

    // 기존 노드 DOM 제거 (svg 제외)
    Array.prototype.slice.call(canvas.querySelectorAll('.node')).forEach(function(el){ el.remove(); });

    var linkPaths = [];
    var maxX = 0, maxY = 0;
    var paletteIndex = 0;

    function mark(node){ maxX = Math.max(maxX, node._x); maxY = Math.max(maxY, node._y); }

    mark(tree);
    renderNode(tree, null);
    if (!tree.collapsed){
      tree.children.forEach(function(c){
        var color = BRANCH_PALETTE[paletteIndex % BRANCH_PALETTE.length];
        paletteIndex++;
        linkPaths.push(connector(tree, c, color));
        walk(c, color);
      });
    }

    function walk(node, color){
      mark(node);
      renderNode(node, color);
      if (!node.collapsed){
        node.children.forEach(function(c){
          linkPaths.push(connector(node, c, color));
          walk(c, color);
        });
      }
    }

    linksSvg.innerHTML = linkPaths.join('');
    linksSvg.setAttribute('width', maxX + 400);
    linksSvg.setAttribute('height', maxY + 200);

    applyTransform();
    if (selectedId) positionToolbar(); else ntoolbar.classList.remove('show');
  }

  function connector(a, b, color){
    var x1 = a._x + a._w, y1 = a._y + 19;
    var x2 = b._x, y2 = b._y + 19;
    var mx = (x1 + x2) / 2;
    var stroke = color ? ' stroke="' + color + '"' : '';
    return '<path d="M' + x1 + ',' + y1 + ' C ' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2 + '"' + stroke + '/>';
  }

  function renderNode(node, color){
    var el = document.createElement('div');
    el.className = 'node ' + node.type + (node.id === selectedId ? ' selected' : '');
    el.style.left = node._x + 'px';
    el.style.top = node._y + 'px';
    el.dataset.id = node.id;
    if (color) el.style.setProperty('--branch-color', color);

    if (node.children.length){
      var dot = document.createElement('span');
      dot.className = 'collapse-dot';
      dot.textContent = node.collapsed ? '+' : node.children.length;
      dot.title = node.collapsed ? '펼치기' : '접기';
      dot.addEventListener('click', function(ev){
        ev.stopPropagation();
        node.collapsed = !node.collapsed;
        scheduleSave();
        render();
      });
      el.appendChild(dot);
    }

    var label = document.createElement('span');
    label.className = 'label';
    if (node.id === editingId){
      var input = document.createElement('input');
      input.value = node.text;
      input.addEventListener('blur', function(){ commitEdit(node, input.value); });
      input.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter'){ ev.preventDefault(); input.blur(); }
        if (ev.key === 'Escape'){ editingId = null; render(); }
      });
      label.appendChild(input);
      setTimeout(function(){ input.focus(); input.select(); }, 0);
    } else {
      label.textContent = node.text;
      label.title = node.text;
    }
    el.appendChild(label);

    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      selectedId = node.id;
      render();
    });
    el.addEventListener('dblclick', function(ev){
      ev.stopPropagation();
      editingId = node.id;
      render();
    });

    canvas.appendChild(el);
    node._w = el.offsetWidth || 140;
  }

  function commitEdit(node, value){
    var v = value.trim();
    if (v) node.text = v;
    editingId = null;
    scheduleSave();
    render();
  }

  function positionToolbar(){
    var node = findNode(tree, selectedId);
    if (!node){ ntoolbar.classList.remove('show'); return; }
    var wrapRect = canvasWrap.getBoundingClientRect();
    var left = pan.x + node._x * zoom;
    var top = pan.y + node._y * zoom - 44;
    ntoolbar.style.left = left + 'px';
    ntoolbar.style.top = Math.max(4, top) + 'px';
    ntoolbar.classList.add('show');
  }

  /* ---------- 편집 동작 ---------- */
  function addChild(id){
    var node = findNode(tree, id);
    if (!node) return;
    node.collapsed = false;
    var n = leaf('새 항목');
    node.children.push(n);
    selectedId = n.id;
    editingId = n.id;
    scheduleSave();
    render();
  }
  function addSibling(id){
    if (id === 'root') return addChild(id);
    var parent = findParent(tree, id, null);
    if (!parent) return;
    var n = leaf('새 항목');
    var idx = parent.children.findIndex(function(c){ return c.id === id; });
    parent.children.splice(idx+1, 0, n);
    selectedId = n.id;
    editingId = n.id;
    scheduleSave();
    render();
  }
  function deleteNode(id){
    if (id === 'root') return;
    var node = findNode(tree, id);
    if (node.children.length && !confirm('"' + node.text + '" 항목과 하위 ' + countAll(node) + '개 항목을 모두 삭제할까요?')) return;
    var parent = findParent(tree, id, null);
    parent.children = parent.children.filter(function(c){ return c.id !== id; });
    selectedId = null;
    scheduleSave();
    render();
  }
  function countAll(node){
    var n = 0;
    node.children.forEach(function(c){ n += 1 + countAll(c); });
    return n;
  }
  function renameStart(id){ editingId = id; render(); }

  function moveNode(id, dir){
    if (id === 'root') return;
    var parent = findParent(tree, id, null);
    if (!parent) return;
    var idx = parent.children.findIndex(function(c){ return c.id === id; });
    var swapWith = idx + dir;
    if (swapWith < 0 || swapWith >= parent.children.length) return;
    var tmp = parent.children[idx];
    parent.children[idx] = parent.children[swapWith];
    parent.children[swapWith] = tmp;
    scheduleSave();
    render();
  }

  ntoolbar.addEventListener('click', function(ev){
    var btn = ev.target.closest('button');
    if (!btn || !selectedId) return;
    var act = btn.dataset.act;
    if (act === 'child') addChild(selectedId);
    else if (act === 'sibling') addSibling(selectedId);
    else if (act === 'rename') renameStart(selectedId);
    else if (act === 'moveup') moveNode(selectedId, -1);
    else if (act === 'movedown') moveNode(selectedId, 1);
    else if (act === 'delete') deleteNode(selectedId);
  });

  document.addEventListener('keydown', function(ev){
    if (editingId) return;
    if (!selectedId) return;
    if (ev.target.tagName === 'INPUT') return;
    if (ev.key === 'Tab'){ ev.preventDefault(); addChild(selectedId); }
    else if (ev.key === 'Enter'){ ev.preventDefault(); addSibling(selectedId); }
    else if (ev.ctrlKey && ev.key === 'ArrowUp'){ ev.preventDefault(); moveNode(selectedId, -1); }
    else if (ev.ctrlKey && ev.key === 'ArrowDown'){ ev.preventDefault(); moveNode(selectedId, 1); }
    else if (ev.key === 'Delete' || ev.key === 'Backspace'){ ev.preventDefault(); deleteNode(selectedId); }
    else if (ev.key === 'F2'){ ev.preventDefault(); renameStart(selectedId); }
  });

  canvasWrap.addEventListener('click', function(){
    selectedId = null;
    ntoolbar.classList.remove('show');
    render();
  });

  /* ---------- 전체 펼치기/접기 ---------- */
  document.getElementById('btnExpandAll').addEventListener('click', function(){
    (function walk(n){ n.collapsed = false; n.children.forEach(walk); })(tree);
    scheduleSave(); render();
  });
  document.getElementById('btnCollapseAll').addEventListener('click', function(){
    tree.children.forEach(function(c){ c.collapsed = true; });
    scheduleSave(); render();
  });

  /* ---------- 내보내기/불러오기/리셋 ---------- */
  document.getElementById('btnExport').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(tree, replacer, 2)], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '바오밥-사이트맵-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });
  function replacer(key, value){
    if (key === '_x' || key === '_y' || key === '_w') return undefined;
    return value;
  }

  var fileInput = document.getElementById('fileInput');
  document.getElementById('btnImport').addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(){
    var file = fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if (!parsed.id || !parsed.children) throw new Error('invalid');
        tree = parsed;
        selectedId = null;
        scheduleSave();
        render();
      }catch(e){
        alert('파일을 읽을 수 없습니다. 이 도구에서 내보낸 JSON 파일인지 확인해주세요.');
      }
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  document.getElementById('btnReset').addEventListener('click', function(){
    if (!confirm('지금까지 수정한 내용이 모두 사라지고 초기 구조(훈련생 5명 기본 항목)로 돌아갑니다. 계속할까요?')) return;
    tree = JSON.parse(JSON.stringify(SEED));
    selectedId = null;
    scheduleSave();
    render();
  });

  /* ---------- 팬 / 줌 ---------- */
  function applyTransform(){
    canvas.style.transform = 'translate(' + pan.x + 'px,' + pan.y + 'px) scale(' + zoom + ')';
    document.getElementById('zoomReset').textContent = Math.round(zoom*100) + '%';
  }

  var panning = false, panStart = null, panOrigin = null;
  canvasWrap.addEventListener('mousedown', function(ev){
    if (ev.target.closest('.node') || ev.target.closest('.ntoolbar')) return;
    panning = true;
    canvasWrap.classList.add('panning');
    panStart = { x: ev.clientX, y: ev.clientY };
    panOrigin = { x: pan.x, y: pan.y };
  });
  window.addEventListener('mousemove', function(ev){
    if (!panning) return;
    pan.x = panOrigin.x + (ev.clientX - panStart.x);
    pan.y = panOrigin.y + (ev.clientY - panStart.y);
    applyTransform();
    if (selectedId) positionToolbar();
  });
  window.addEventListener('mouseup', function(){
    panning = false;
    canvasWrap.classList.remove('panning');
  });

  canvasWrap.addEventListener('wheel', function(ev){
    ev.preventDefault();
    var delta = ev.deltaY > 0 ? -0.08 : 0.08;
    zoom = Math.min(2, Math.max(0.35, zoom + delta));
    applyTransform();
    if (selectedId) positionToolbar();
  }, { passive:false });

  document.getElementById('zoomIn').addEventListener('click', function(){ zoom = Math.min(2, zoom+0.1); applyTransform(); });
  document.getElementById('zoomOut').addEventListener('click', function(){ zoom = Math.max(0.35, zoom-0.1); applyTransform(); });
  document.getElementById('zoomReset').addEventListener('click', function(){ zoom = 1; pan = {x:80,y:60}; applyTransform(); });

  render();
})();
</script>
